<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plans</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-any-192.png">
  <link rel="apple-touch-icon" href="icon-maskable-512.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // Relative URLs need the trailing slash when served under /plans.
    if (!location.pathname.endsWith('/')) location.replace(location.pathname + '/' + location.search + location.hash);
    // Look: ?look=flat|tint, remembered on this device.
    try {
      const look = new URLSearchParams(location.search).get('look') || localStorage.getItem('look');
      if (look) { localStorage.setItem('look', look); document.documentElement.dataset.look = look; }
    } catch {}
  </script>
</head>
<body>
  <main>
    <header>
      <button id="title" title="Go to today"></button>
      <span id="status"></span>
      <span id="flash"></span>
      <nav id="tabs"></nav>
    </header>
    <div id="editor"></div>
  </main>
  <footer>⌘[ ⌘] tab · ⌘⇧[ ⌘⇧] day, or week in the week view · ⌘\ week view · ⌘S sync</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
